# Controle de Despesa — o quinto stack da plataforma.
# Projeto Compose separado; a ordem de subida quem coordena e o stack.ps1.
name: controle_despesa

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    # Nao publica porta (achado nº1 da infra/AUDITORIA.md).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    environment:
      TZ: America/Sao_Paulo
      APP_CONFIG: ${APP_CONFIG:-prod}
      FLASK_APP: wsgi
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      OIDC_ISSUER: http://${HOST_IP:?defina HOST_IP no .env}:8080/realms/ufc
      OIDC_CLIENT_ID: controle-despesa-web
      OIDC_CLIENT_SECRET: ${CONTROLE_DESPESA_CLIENT_SECRET:?defina CONTROLE_DESPESA_CLIENT_SECRET no .env}
      OIDC_REQUIRED_GROUP: ${OIDC_REQUIRED_GROUP:-/apps/controle-despesa}
      SESSION_SECRET: ${CONTROLE_DESPESA_SESSION_SECRET:?defina CONTROLE_DESPESA_SESSION_SECRET no .env}
      # Entra como admin sem depender de grupo.
      ADMIN_MESTRE_EMAIL: ${ADMIN_MESTRE_EMAIL:-}
      # Mesmo diretorio do sidecar de backup.
      BACKUP_DIR: /backups
      HOST_IP: ${HOST_IP}
      PORTA_PUBLICA: ${CONTROLE_DESPESA_PORT:-3050}
      # Portas dos outros sistemas, para o seletor "Sistemas".
      PORTAL_PORT: ${PORTAL_PORT:-3080}
      INVENTARIO_PORT: ${INVENTARIO_PORT:-3030}
      RECEITA_PORT: ${RECEITA_PORT:-3040}
      DESPESA_PORT: ${DESPESA_PORT:-3010}
    volumes:
      - ./backups:/backups
    ports:
      - "${CONTROLE_DESPESA_PORT:-3050}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    # sed: normaliza CRLF de um checkout no Windows antes de rodar.
    entrypoint: ["/bin/sh", "-c", "sed 's/\r//g' /backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

networks:
  private:
  public:

volumes:
  postgres_data:
